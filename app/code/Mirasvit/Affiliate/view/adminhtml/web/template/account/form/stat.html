<div class="admin__data-grid-wrap-static">
    <table class="data-grid">
        <tr>
            <th class="data-grid-th">Clicks</th>
            <th class="data-grid-th">Leads</th>
            <th class="data-grid-th">Impression</th>
            <th class="data-grid-th">Sales</th>
        </tr>
        <tr>
            <td><span data-bind="text: $data.value().click"></span></td>
            <td><span data-bind="text: $data.value().lead"></span></td>
            <td><span data-bind="text: $data.value().impression"></span></td>
            <td><span data-bind="text: $data.value().sale"></span></td>
        </tr>
    </table>
</div>
